services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    ports: ["27017:27017"]
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
  server:
    build: ./server
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/dsps
      CLIENT_ORIGIN: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-this}
      COOKIE_SECURE: "false"
    depends_on: [mongo, ai-service]
    ports: ["5000:5000"]
volumes:
  mongo_data:
